name: Build lmi postmarketOS image

# 云端编译红米 K30 Pro / POCO F2 Pro (lmi) 的 postmarketOS 镜像
# 产物：boot.img + xiaomi-lmi.img.xz（Actions 运行结束后在 Artifacts 下载）

on:
  workflow_dispatch:
    inputs:
      ui:
        description: "桌面环境（phosh 轻量推荐 / plasma-mobile）"
        required: false
        default: "phosh"
        type: choice
        options:
          - phosh
          - plasma-mobile
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-lmi.yml"

permissions:
  contents: read

concurrency:
  group: lmi-build
  cancel-in-progress: false

env:
  PMOS_PASSWORD: "147147"
  APORTS_REPO: "https://github.com/yuweiyuan8/pmaports.git"
  APORTS_BRANCH: "nikroks/alioth"
  KERNEL_PKG: "linux-postmarketos-qcom-sm8250-lmi"
  DEVICE_PKG: "device-xiaomi-lmi"
  WORK_DIR: "/mnt/pmb/work"
  APORTS_DIR: "/mnt/pmb/pmaports-lmi"

jobs:
  build:
    name: build lmi image
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: 准备大盘（pmbootstrap 需要 40GB 以上）
        run: |
          set -eux
          df -h /
          sudo mkdir -p /mnt/pmb
          sudo chown -R "$USER":"$USER" /mnt/pmb
          df -h /mnt | tail -1

      - uses: actions/checkout@v4

      # runner 每次都是全新机器，缓存已编好的包 + ccache + 源码包，
      # 否则每轮迭代都要从零重编 45 分钟的内核
      - name: 恢复构建缓存
        uses: actions/cache/restore@v4
        with:
          path: |
            /mnt/pmb/work/packages
            /mnt/pmb/work/cache_ccache_aarch64
            /mnt/pmb/work/cache_distfiles
            /mnt/pmb/work/config_abuild
          key: pmb-v1-${{ github.run_id }}
          restore-keys: |
            pmb-v1-

      - name: 安装宿主依赖
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq git kpartx openssl tar procps unzip xz-utils

      - name: 安装 pmbootstrap
        run: |
          set -eux
          git clone --depth=1 https://gitlab.postmarketos.org/postMarketOS/pmbootstrap.git "$RUNNER_TEMP/pmbootstrap"
          sudo ln -sf "$RUNNER_TEMP/pmbootstrap/pmbootstrap.py" /usr/local/bin/pmbootstrap
          pmbootstrap --version

      - name: 拉取含 lmi 设备包的社区 pmaports
        run: |
          set -euxo pipefail
          git clone --depth=1 -b "$APORTS_BRANCH" "$APORTS_REPO" "$APORTS_DIR"
          # pmbootstrap 要在 pmaports 里找到一个「官方上游」远程，否则直接报
          # "could not find remote name for any URL"，fork 的 origin 它认不出来
          git -C "$APORTS_DIR" remote remove upstream 2>/dev/null || true
          git -C "$APORTS_DIR" remote add upstream https://gitlab.postmarketos.org/postMarketOS/pmaports.git
          # pmbootstrap 会用 `git show upstream/main:channels.cfg` 读通道表，
          # 所以必须有 upstream/main 这个 ref
          if ! git -C "$APORTS_DIR" fetch --depth=1 upstream main:refs/remotes/upstream/main; then
            echo "::warning::拉取 upstream/main 失败，改用本地 HEAD 兜底"
            git -C "$APORTS_DIR" update-ref refs/remotes/upstream/main "$(git -C "$APORTS_DIR" rev-parse HEAD)"
          fi
          git -C "$APORTS_DIR" show upstream/main:channels.cfg | head -20
          git -C "$APORTS_DIR" remote -v
          git -C "$APORTS_DIR" log -1 --format='commit %H %ad %s' --date=iso
          test -d "$APORTS_DIR/device/testing/$DEVICE_PKG"
          # pmbootstrap 3.x 的 install 阶段会调用
          # pmb.parse.deviceinfo_schema_default_boot_filesystem()，要求 pmaports 根目录存在
          # deviceinfo_schema.toml，否则报 "pmaports checkout does not contain a
          # 'deviceinfo_schema.toml'"，并死在 PREPARE INSTALL BLOCKDEVICE 之后。
          # 老 fork（23.12 时代）没有该文件，这里补一个最小 0.1 schema（默认 ext2，
          # 与上游一致）；deviceinfo 关键字校验在上游被注释掉了，只需 boot_filesystem。
          install -m 644 "$GITHUB_WORKSPACE/ci/deviceinfo_schema.toml" "$APORTS_DIR/deviceinfo_schema.toml"
          test -s "$APORTS_DIR/deviceinfo_schema.toml"
          python3 -c 'import sys,tomllib; d=tomllib.load(open(sys.argv[1],"rb")); assert d["metadata"]["schema_version"]=="0.1"; print("deviceinfo_schema ok, boot fs =", d["variable"]["flash"]["boot_filesystem"]["default_value"])' "$APORTS_DIR/deviceinfo_schema.toml"
          # fork 里 temp/abuild 覆盖包（99993.12.0）从 craftyguy/abuild 的某个 commit 取源码，
          # 该地址已失效，会卡在「abuild 自己编不出来」。我们不用 systemd，直接删掉，
          # 让 pmbootstrap 用二进制仓库里的 abuild。
          rm -rf "$APORTS_DIR/temp/abuild"
          ls "$APORTS_DIR/temp" | head -10

      # pmbootstrap 要求「配置文件已存在 + work 目录已存在」才肯执行任何命令，
      # 所以不能先用 pmbootstrap config 去建它们（那会立刻以退出码 2 失败），直接写文件。
      - name: 写入 pmbootstrap 配置
        env:
          UI_CHOICE: ${{ inputs.ui || 'phosh' }}
        run: |
          set -eux
          mkdir -p "$WORK_DIR" "$HOME/.config"
          printf '8\n' > "$WORK_DIR/version"
          {
            echo "[pmbootstrap]"
            echo "aports = $APORTS_DIR"
            echo "device = xiaomi-lmi"
            echo "ui = $UI_CHOICE"
            echo "user = user"
            echo "hostname = lmi"
            echo "timezone = Asia/Shanghai"
            echo "jobs = $(nproc)"
            echo "work = $WORK_DIR"
            # 旧 fork 的 _pmb_recommends 里混着新版 Alpine 已删除的包（如 gvfs-afp），
            # 所以装包时跳过 recommends，这里显式补上字体
            echo "extra_packages = font-droid,font-droid-nonlatin"
          } > "$HOME/.config/pmbootstrap_v3.cfg"
          echo "----- pmbootstrap_v3.cfg -----"
          cat "$HOME/.config/pmbootstrap_v3.cfg"
          echo "----- verify -----"
          pmbootstrap config device
          pmbootstrap config aports
          pmbootstrap config ui
          pmbootstrap status || true

      # 1) APKBUILD 里写的是 linux-$_tag.tar.gz（_tag=lmi），不能直接 grep 最终文件名
      # 2) v6.19 分支会动，源码包内容变了 sha512 就对不上，所以无条件重算校验和
      - name: 修正内核源码包地址并重算校验和
        run: |
          set -euxo pipefail
          A="$APORTS_DIR/device/testing/$KERNEL_PKG/APKBUILD"
          URL='https://github.com/yuweiyuan8/linux/archive/v6.19/linux-lmi.tar.gz'
          CODE=$(curl -sIL --max-time 60 -o /dev/null -w '%{http_code}' "$URL" || true)
          echo "probe: $URL -> HTTP ${CODE:-none}"
          if [ "${CODE:-none}" != "200" ]; then
            echo "旧地址不可用，切换到改名后的仓库"
            if grep -q 'yuweiyuan8/linux/archive' "$A"; then
              sed -i 's#https://github.com/yuweiyuan8/linux/archive/v6.19/linux-$_tag.tar.gz#https://github.com/yuweiyuan8/Linux-redmi-k30pro-6.19/archive/v6.19.tar.gz#' "$A"
            fi
            grep -n 'archive/' "$A" | head -3 || true
          fi
          echo "重算校验和（源码包内容可能已变）"
          if ! OUT=$(pmbootstrap checksum "$KERNEL_PKG" 2>&1); then
            echo "::error title=checksum failed::$(printf '%s' "$OUT" | tail -c 3000 | tr '\n' '|')"
            exit 1
          fi
          printf '%s\n' "$OUT" | tail -6
          # 仓库改名后，GitHub 归档的顶层目录名也变了（linux-v6.19 -> 新仓库名-v6.19），
          # 而 APKBUILD 仍写死 builddir="$srcdir/linux-v6.19"，导致 abuild 找不到 Makefile。
          TB=$(ls -1 /mnt/pmb/work/chroot_native/var/cache/distfiles/${KERNEL_PKG}-*.tar.gz 2>/dev/null | head -1 || true)
          if [ -n "${TB:-}" ]; then
            TOP=$(tar tzf "$TB" 2>/dev/null | head -1 | cut -d/ -f1 || true)
            echo "tarball top dir: ${TOP:-unknown}"
            sed -i "s#^builddir=.*#builddir=\"\\\$srcdir/$TOP\"#" "$A"
            grep -n '^builddir=' "$A"
          else
            echo "::warning::没找到已下载的源码包，跳过 builddir 修正"
          fi

      # 失败时把日志尾部塞进注解，方便在 API 里直接看到原因（无需管理员权限看日志）
      # --details-to-stdout：把 abuild/编译器的真实输出也打到 step 日志里
      - name: 编译内核（交叉编译，30–60 分钟）
        run: |
          set -o pipefail
          if ! pmbootstrap --details-to-stdout -y build --lax "$KERNEL_PKG" 2>&1 | tee /tmp/kernel.log; then
            echo "::error title=kernel build failed::$(grep -inE 'error|fatal|cannot find|no such file|undefined reference|make.*\*\*\*' /tmp/kernel.log | tail -10 | tr -d '%' | tr '\n' '|' | tail -c 3500)"
            echo "--- pmbootstrap log.txt (last 80) ---"
            tail -80 /mnt/pmb/work/log.txt 2>/dev/null || true
            exit 1
          fi

      - name: 编译设备包
        run: |
          set -o pipefail
          if ! pmbootstrap --details-to-stdout -y build --lax "$DEVICE_PKG" 2>&1 | tee /tmp/device.log; then
            echo "::error title=device build failed::$(tail -c 6000 /tmp/device.log | tr -d '%' | tr '\n' '|')"
            exit 1
          fi

      # device-xiaomi-lmi-nonfree-firmware 依赖 firmware-xiaomi-lmi，但依赖树没有
      # 自动把它带出来编（子包 depends 未递归），导致 apk 报 no such package
      - name: 编译设备固件包
        run: |
          set -euxo pipefail
          # 这个包只是拷文件、不编译；cross-native 下 fakeroot 会报
          # "libfakeroot internal error: payload not recognized" 并导致写 apk 权限不足，
          # 去掉 pmb:cross-native 让它走 aarch64 chroot（qemu）
          FW="$APORTS_DIR/device/testing/firmware-xiaomi-lmi/APKBUILD"
          sed -i 's/ pmb:cross-native//' "$FW"
          grep -n '^options=' "$FW"
          mkdir -p /mnt/pmb/work/packages/edge/aarch64
          sudo chown -R 12345:12345 /mnt/pmb/work/packages

          set +e
          pmbootstrap --details-to-stdout -y build --lax firmware-xiaomi-lmi 2>&1 | tee /tmp/firmware.log
          rc=${PIPESTATUS[0]}
          # 缓存里的索引可能由上一轮的临时密钥签名，abuild 会报 UNTRUSTED signature。
          # 此时删掉旧索引重试：abuild 会用当前密钥从所有 *.apk 重建（内核包不会丢）。
          if [ "$rc" -ne 0 ] && grep -q 'UNTRUSTED signature' /tmp/firmware.log; then
            echo "::warning::索引签名不可信，删除旧索引后重试"
            find /mnt/pmb/work/packages -name 'APKINDEX.tar.gz*' -delete || true
            pmbootstrap --details-to-stdout -y build --lax firmware-xiaomi-lmi 2>&1 | tee /tmp/firmware.log
            rc=${PIPESTATUS[0]}
          fi
          set -e

          if [ "$rc" -ne 0 ]; then
            echo "::error title=firmware build failed::$(tail -40 /tmp/firmware.log | tr -d '%' | tr '\n' '|' | tail -c 3500)"
            exit 1
          fi

      - name: 生成 rootfs
        run: |
          set -o pipefail
          if ! pmbootstrap --details-to-stdout -y install --no-recommends --password "$PMOS_PASSWORD" 2>&1 | tee /tmp/install.log; then
            echo "::error title=install failed::$(tail -c 6000 /tmp/install.log | tr -d '%' | tr '\n' '|')"
            exit 1
          fi

      - name: 导出并压缩镜像
        run: |
          set -euxo pipefail
          pmbootstrap export
          ls -lh /tmp/postmarketOS-export
          mkdir -p out
          cp /tmp/postmarketOS-export/boot.img out/boot.img
          cp /tmp/postmarketOS-export/xiaomi-lmi.img out/xiaomi-lmi.img
          xz -T0 -1 out/xiaomi-lmi.img
          ( cd out && sha256sum boot.img xiaomi-lmi.img.xz > SHA256SUMS.txt && cat SHA256SUMS.txt )
          du -h out/*

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-lmi-pmos
          path: out/*
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: 失败时上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/*.log
            /mnt/pmb/work/log.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: 准备缓存目录
        if: always()
        run: mkdir -p /mnt/pmb/work/packages /mnt/pmb/work/cache_ccache_aarch64 /mnt/pmb/work/cache_distfiles /mnt/pmb/work/config_abuild

      # 即使本轮失败也保存，下一轮就能跳过内核编译
      - name: 保存构建缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /mnt/pmb/work/packages
            /mnt/pmb/work/cache_ccache_aarch64
            /mnt/pmb/work/cache_distfiles
            /mnt/pmb/work/config_abuild
          key: pmb-v1-${{ github.run_id }}
